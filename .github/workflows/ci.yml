name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-benchmark.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q
      - name: Build distributions
        run: python -m build

  neural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install neural package and pinned benchmark
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[neural,dev]"
          python -m pip install -r requirements-benchmark.txt
      - name: Test neural forward and backward paths
        run: pytest -q tests/test_models.py tests/test_training.py tests/test_meta_q.py tests/test_reference_artifacts.py

  mos-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and pinned MOS benchmark
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-benchmark.txt
      - name: Test MOS adapter and matched-state generator
        run: pytest -q tests/test_mos_adapter.py tests/test_counterfactuals.py tests/test_heuristic_runtime.py tests/test_pomcp.py tests/test_fleet_throughput.py
